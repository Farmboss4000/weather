<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stoebner Farms Weather Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="title-block">
          <h1>Stoebner Farms Weather Report</h1>
          <p id="station-meta" class="station-meta">Connecting...</p>
        </div>
        <div class="controls">
          <div id="status" class="status status--pending">
            <span class="status-dot"></span>
            <span id="status-text">Connecting</span>
          </div>
          <div class="unit-toggle" role="group" aria-label="Units">
            <button id="unit-imperial" class="unit-btn is-active" type="button">
              °F
            </button>
            <button id="unit-metric" class="unit-btn" type="button">°C</button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section id="forecast" class="forecast-section">
        <div class="section-header">
          <h2>7-Day Forecast</h2>
          <span id="forecast-status" class="section-status"></span>
        </div>
        <div id="forecast-grid" class="forecast-grid">
          <div class="forecast-empty">Loading forecast…</div>
        </div>
      </section>

      <section class="hero">
        <div class="hero-main">
          <div class="hero-temp">
            <span id="hero-temp" class="hero-temp__value">--</span>
            <span id="hero-temp-unit" class="hero-temp__unit">°F</span>
          </div>
          <div class="hero-condition">Current Conditions</div>
        </div>
        <div class="hero-detail">
          <div class="hero-highlow">
            <span class="hero-hilo hero-hilo--hi"><span class="hero-hilo__label">H</span> <strong id="hero-hi">--</strong></span>
            <span class="hero-hilo hero-hilo--lo"><span class="hero-hilo__label">L</span> <strong id="hero-lo">--</strong></span>
          </div>
          <div class="hero-feels">Feels like <strong id="hero-feels">--</strong></div>
          <div id="hero-updated" class="hero-updated">—</div>
        </div>
      </section>

      <section class="module">
        <div class="section-header">
          <h2>Conditions</h2>
        </div>
        <div id="cards" class="cards"></div>
      </section>

      <section id="rainfall" class="module">
        <div class="section-header">
          <h2>Daily Rainfall — Past 30 Days</h2>
          <span id="rainfall-status" class="section-status"></span>
        </div>
        <div class="rainfall-scroll">
          <table id="rainfall-table" class="rainfall-table" aria-label="Daily rainfall for the past 30 days">
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col" class="rain-value">Rainfall</th>
              </tr>
            </thead>
            <tbody id="rainfall-body">
              <tr><td colspan="2" class="rainfall-empty">Loading history…</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <p id="error" class="error" hidden></p>
    </main>

    <footer class="footer">
      <span>Live data from the Ambient Weather Network. Forecast from Open-Meteo.</span>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
