services:
  - type: web
    name: kestrel-weather-dashboard
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: AMBIENT_APPLICATION_KEY
        sync: false
      - key: AMBIENT_API_KEY
        sync: false
      - key: AMBIENT_DEVICE_MAC
        value: ""
      - key: AMBIENT_STATION_TZ
        value: America/Chicago
      - key: TEMPSTICK_API_KEY
        value: 7f238f90c8c195df36b61c372b74fea10685328579aa88280e
      - key: TEMPSTICK_UNIT
        value: fahrenheit
      - key: NODE_VERSION
        value: "20"
